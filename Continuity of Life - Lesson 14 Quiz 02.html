<html lang="en"><head><meta charset="utf-8">

<title>Continuity of Life - Quiz 2</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#1d2b22;--mu:#5d6f63;--ac:#2f9e55;--ok:#d6f2de;--okb:#2f9e55;--bad:#fde0e0;--badb:#d64545;--bd:#cfdcd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
.top{text-align:center}.top img{width:300px;max-width:100%;height:auto;display:block;margin:6px auto}
h1{font-size:1.7rem;margin:6px 0 0}.tp{color:var(--tx);margin:10px 0 0;font-size:1.6rem;font-weight:800}.sub{font-weight:800;font-size:1.7rem;margin:2px 0 10px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}
#hd{width:200px;max-width:55%;height:auto;margin:8px 0 8px auto}.sc{display:flex;justify-content:space-between;font-weight:700}.sc b{color:var(--ac);font-size:1.2rem}
.pg{height:8px;background:var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.tag{display:inline-block;font-size:.8rem;background:var(--ok);color:var(--tx);padding:2px 10px;border-radius:20px;margin-bottom:8px}
.q{font-size:1.15rem;font-weight:700;margin:4px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ok)}.opt.ok{border-color:var(--okb);background:var(--ok)}.opt.no{border-color:var(--badb);background:var(--bad)}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--ac);color:#fff}button.b.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}button:disabled{opacity:.5;cursor:default}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:600}.fb.ok{background:var(--ok)}.fb.no{background:var(--bad)}
.lst{background:var(--bg);border-radius:10px;padding:8px 12px;margin:8px 0;columns:3;column-gap:14px}.lst div{padding:2px 0;break-inside:avoid;font-size:.95rem}@media(max-width:480px){.lst{columns:2}}.lst.one{columns:1!important}.lst div.st{text-decoration:line-through;text-decoration-thickness:2px;color:var(--badb);opacity:.75}
.grp{margin:12px 0}.grp .l{font-weight:700;margin-bottom:6px}
.bx{width:44px;height:44px;text-align:center;font:700 1.2rem inherit;font-family:inherit;border:2px solid var(--bd);border-radius:8px;margin-right:8px;background:var(--card);color:var(--tx);text-transform:uppercase}
.bx.ok{border-color:var(--okb);background:var(--ok)}.bx.no{border-color:var(--badb);background:var(--bad)}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.tb{grid-template-columns:1fr}}
.big{font-size:3rem;font-weight:800;color:var(--ac);text-align:center}
.mk{color:var(--mu);font-weight:600;font-size:.9rem}.hint{color:var(--mu);font-size:.9rem;margin:-6px 0 8px}.im{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:8px 0}.im figure{margin:0;text-align:center;font-weight:700}.im img{max-width:100%;height:auto;max-height:230px}.tx{width:100%;max-width:240px;height:44px;border:2px solid var(--bd);border-radius:8px;padding:0 10px;font:inherit;background:var(--card);color:var(--tx);margin:0 8px 8px 0}.tx.ok{border-color:var(--okb);background:var(--ok)}.tx.no{border-color:var(--badb);background:var(--bad)}.rv{color:var(--badb);font-weight:700;text-transform:capitalize}.tx:disabled:not(.ok):not(.no){opacity:.45}.hd{font-weight:800;font-size:1.1rem;margin:14px 0 2px;border-top:2px solid var(--bd);padding-top:8px}.rv.n{text-transform:none;margin:0 0 6px}.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}.cg .grp{margin:2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.cg .l{margin:0;min-width:1.2em}.cg .tx{width:110px;height:34px;margin:0;font-size:.95rem}.cg .rv{font-size:.8rem}.opt.pr{font-size:.9rem;line-height:1.4}.im img{max-height:200px}.ov{position:relative;max-width:400px;margin:8px auto}.ov img{display:block;width:100%;height:auto;max-height:none}.ov .bx{position:absolute;width:28px;height:28px;transform:translate(-50%,-50%);margin:0;padding:0;font-size:.9rem}.cr{position:absolute;transform:translate(-50%,18px);color:var(--badb);font-weight:800;font-size:.85rem}</style></head><body><div class="w">

const Q=[{"w": 11, "t": "typ", "cp": 1, "q": "Name the parts of the flower shown below (A-J).", "img": [[IM.fl,""]], "groups": [{"l": "A", "n": 1, "rv": 1, "a": [["stigma"]]}, {"l": "B", "n": 1, "rv": 1, "a": [["style", "gynoecium", "pistil"]]}, {"l": "C", "n": 1, "rv": 1, "a": [["ovule", "ovary"]]}, {"l": "D", "n": 1, "rv": 1, "a": [["pedicel", "stalk"]]}, {"l": "E", "n": 1, "rv": 1, "a": [["sepal", "sepals", "calyx"]]}, {"l": "F", "n": 1, "rv": 1, "a": [["receptacle"]]}, {"l": "G", "n": 1, "rv": 1, "a": [["petal", "petals", "corolla"]]}, {"l": "H", "n": 1, "rv": 1, "a": [["filament"]]}, {"l": "I", "n": 1, "rv": 1, "a": [["anther"]]}, {"l": "J", "n": 1, "rv": 1, "a": [["androecium", "stamen"]]}]}, {"w": 5, "t": "typ", "q": "The gynoecium consists of three main parts. Type those three parts.", "groups": [{"l": "Parts", "n": 3, "a": [["stigma"], ["style"], ["ovary"]]}]}, {"w": 5, "q": "Explain what bisexual flowers and unisexual flowers are.", "a": "<b>Bisexual flowers:</b> Flowers that consist of both male and female parts<br><b>Unisexual flowers:</b> Flowers that consist of either male or female parts", "x": ["<b>Bisexual flowers:</b> Flowers that consist of either male or female parts<br><b>Unisexual flowers:</b> Flowers that consist of both male and female parts", "<b>Bisexual flowers:</b> Flowers that have only two petals<br><b>Unisexual flowers:</b> Flowers that have only one petal", "<b>Bisexual flowers:</b> Flowers borne on two different plants<br><b>Unisexual flowers:</b> Flowers borne on a single plant"]}, {"w": 5, "q": "Under unisexual flowers, explain staminate flowers and pistillate flowers.", "a": "<b>Staminate flowers:</b> Male flowers that have only the androecium (stamens)<br><b>Pistillate flowers:</b> Female flowers that have only the gynoecium (pistil)", "x": ["<b>Staminate flowers:</b> Female flowers that have only the gynoecium (pistil)<br><b>Pistillate flowers:</b> Male flowers that have only the androecium (stamens)", "<b>Staminate flowers:</b> Flowers that have both stamens and a pistil<br><b>Pistillate flowers:</b> Flowers that have neither stamens nor a pistil", "<b>Staminate flowers:</b> Flowers with large petals<br><b>Pistillate flowers:</b> Flowers with small petals"]}, {"w": 5, "q": "Explain monoecious plants and dioecious plants.", "a": "<b>Monoecious plants:</b> Plants that bear both staminate and pistillate flowers on the same plant (e.g. pumpkin, corn)<br><b>Dioecious plants:</b> Plants whose staminate and pistillate flowers are born separately on two plants (e.g. papaw)", "x": ["<b>Monoecious plants:</b> Plants whose staminate and pistillate flowers are born separately on two plants (e.g. papaw)<br><b>Dioecious plants:</b> Plants that bear both staminate and pistillate flowers on the same plant (e.g. pumpkin, corn)", "<b>Monoecious plants:</b> Plants that bear only bisexual flowers<br><b>Dioecious plants:</b> Plants that never produce flowers", "<b>Monoecious plants:</b> Plants that have only staminate flowers<br><b>Dioecious plants:</b> Plants that have only pistillate flowers"]}, {"w": 4, "t": "typ", "q": "Pollination occurs in two ways. Name the type of pollination shown in each diagram.", "img": [[IM.sp,"Diagram X"],[IM.cp,"Diagram Y"]], "groups": [{"l": "Diagram X", "n": 1, "a": [["self pollination", "self"]]}, {"l": "Diagram Y", "n": 1, "a": [["cross pollination", "cross"]]}]}, {"w": 6, "q": "Explain self-pollination and cross-pollination.", "a": "<b>Self-pollination:</b> Depositing matured pollen on the stigma of the same flower<br><b>Cross-pollination:</b> Depositing matured pollen on the stigma of a flower of the same plant or of another plant of the same species", "x": ["<b>Self-pollination:</b> Depositing matured pollen on the stigma of a flower of the same plant or of another plant of the same species<br><b>Cross-pollination:</b> Depositing matured pollen on the stigma of the same flower", "<b>Self-pollination:</b> Fusion of male and female gametes inside the ovule<br><b>Cross-pollination:</b> Production of pollen in the anther", "<b>Self-pollination:</b> Transfer of pollen only by wind<br><b>Cross-pollination:</b> Transfer of pollen only by water"]}, {"w": 8, "t": "let", "q": "Type the letters of FIVE adaptations developed by flowers to prevent self-pollination.", "mk": {"gl": ["Your answer"], "items": [["Having unisexual flowers", 0], ["Self-sterility", 0], ["Hercogamy (stamens and stigma at a distance)", 0], ["Having exserted stamens", 0], ["Dichogamy (stamens and pistil maturing at different times)", 0], ["Having large and colourful flowers", -1], ["Producing a large amount of light pollen", -1], ["Having flowers with a fragrance", -1]]}}, {"w": 4, "t": "typ", "q": "Write the three agents of pollination.", "groups": [{"l": "Agents", "n": 3, "a": [["animals", "animal", "insects", "insect"], ["wind"], ["water"]]}]}, {"w": 14, "t": "let", "q": "Complete the diagram of fertilization and seed formation. Type the letter of the correct term in each empty box.", "dg": {"img": IM.fz, "terms": ["Meiosis", "Ovule", "Ovary", "Ovum", "Fertilization", "Seed coat", "Embryo", "Zygote", "Pollen tube", "Cotyledon"], "boxes": [{"p": [51.3, 9.8], "t": "Meiosis"}, {"p": [56.5, 29.8], "t": "Meiosis"}, {"p": [36.6, 41.7], "t": "Ovule"}, {"p": [47.3, 44.9], "t": "Ovary"}, {"p": [73.2, 32.9], "t": "Ovum"}, {"p": [72.4, 80.6], "t": "Fertilization"}, {"p": [47.7, 77.1], "t": "Seed coat"}, {"p": [46.2, 96.5], "t": "Embryo"}, {"p": [70.8, 94.1], "t": "Zygote"}]}}, {"w": 7, "t": "let", "q": "Type the letters of FIVE changes that occur in a flower after fertilization.", "mk": {"gl": ["Your answer"], "items": [["The ovary develops to form the fruit", 0], ["The wall of the ovary becomes the pericarp", 0], ["The fertilized ovule develops into a seed", 0], ["The wall of the ovule becomes the testa (seed coat)", 0], ["Sepals, petals, stamens and stigma wither and are worn out", 0], ["The anthers produce more pollen", -1], ["New flowers grow on the ovary", -1], ["The petals become larger and more colourful", -1]]}}, {"w": 3, "q": "Explain what parthenocarpy is.", "a": "The process of developing fruits without fertilization", "x": ["The process of developing seeds without a flower", "The process of fertilization inside the ovule", "The process of dispersal of fruits by animals"]}, {"w": 5, "t": "typ", "q": "Write the four factors essential for seed germination.", "groups": [{"l": "Factors", "n": 4, "a": [["viability of the seed", "viability", "viable seed", "viable seeds", "seed viability"], ["air", "oxygen"], ["water", "moisture"], ["temperature", "optimum temperature"]]}]}, {"w": 3, "q": "What is seed dormancy?", "a": "Seeds do not germinate even though the essential factors for germination are fulfilled", "x": ["Seeds germinate very quickly in any condition", "Seeds die when water is available", "Seeds produce flowers before germinating"]}, {"w": 4, "t": "let", "q": "Type the letters of the TWO factors affecting seed dormancy.", "mk": {"gl": ["Your answer"], "items": [["The embryo has not matured", 0], ["Impermeability of the testa to water or oxygen", 0], ["Too much sunlight", -1], ["Presence of pollen", -1], ["The seed being too large", -1], ["Presence of many leaves", -1]]}}, {"w": 7, "t": "let", "q": "Type the letters of FIVE methods used to break seed dormancy.", "mk": {"gl": ["Your answer"], "items": [["Storing seeds for some period of time", 0], ["Burning the villi on the seed coat (e.g. teak)", 0], ["Removing the seed coat (e.g. orange seeds)", 0], ["Keeping the seeds in hot water (e.g. lead tree)", 0], ["Gently cracking the seed coat (e.g. nelli)", 0], ["Planting the seeds deeper in dry soil", -1], ["Spraying pesticides on the seeds", -1], ["Keeping the seeds in the freezer for a month", -1]]}}, {"w": 4, "t": "typ", "q": "There are two main types of seed germination. Identify the type shown in each diagram.", "img": [[IM.ep,"Diagram X"], [IM.hy,"Diagram Y"]], "groups": [{"l": "Diagram X", "n": 1, "a": [["epigeal germination" if(q.t&&!q.dg){const gs=q.groups,ty=q.t==="typ";h+='<div class="'+(gs.length>1&&!q.stack?(q.cp?"cg":"tb"):"")+'">'+gs.map((g,gi)=>(g.h?'<div class="hd">'+g.h+'</div>':'')+'<div class="grp"><div class="l" data-gl="'+gi+'">'+(g.gate?"Examples (answer the diagram first)":g.l)+'</div>'+Array.from({length:ty?g.n:(g.nb||g.ans.length)},()=>ty?'<input class="tx" data-v="'+(g.v||1)+'"'+(g.gate?' disabled':'')+' data-g="'+gi+'" autocomplete="off" autocapitalize="off" aria-label="'+(g.gate?"example":g.l)+'">':'<input class="bx" maxlength="1" data-g="'+gi+'" aria-label="'+g.l+'">').join("")+'</div>').join("")+'</div>'}
else if(!q.dg)h+=q.o.map((o,k)=>'<button class="opt'+(o.includes("<br>")?" pr":"")+'" data-k="'+k+'">'+o+'</button>').join("");
h+='<div id="fb"></div><div class="btns"><button class="b g" id="pv"'+(i?'':' disabled')+'>Back</button><button class="b g" id="nx">'+(i===N-1?"Skip & finish":"Skip")+'</button></div>';

document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.k;check()});
document.querySelectorAll(".bx").forEach(b=>b.oninput=()=>{b.value=b.value.toUpperCase().replace(/[^A-P]/g,"");const g=Q[i].groups[+b.dataset.g],seen=new Set();[...document.querySelectorAll('.bx[data-g="'+b.dataset.g+'"]')].forEach(x=>{x.classList.remove("ok","no");if(x.value){const ok=g.ans.includes(x.value)&&!seen.has(x.value);if(ok)seen.add(x.value);x.classList.add(ok?"ok":"no")}});const all=[...document.querySelectorAll(".bx")],n=all[all.indexOf(b)+1];if(b.value&&n&&!n.value)n.focus();strike();if(all.every(x=>x.value))check()});
document.querySelectorAll(".tx").forEach(b=>{b.onchange=()=>evalTx(b);b.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();evalTx(b);const all=[...document.querySelectorAll(".tx")],n=all.slice(all.indexOf(b)+1).find(x=>!x.disabled);if(n)n.focus()}}});
$("pv").onclick=()=>{i--;show();window.scrollTo(0,0)};

function strike(){const s=new Set([...document.querySelectorAll(".bx.ok")].map(b=>b.value));document.querySelectorAll(".lst div").forEach(d=>d.classList.toggle("st",s.has(d.dataset.l)))}
function finish(f,msg){res[i]=f;done=true;upd();$("fb").innerHTML='<div class="fb '+(f===1?"ok":"no")+'">'+(f===1?"Correct! Well done.":(f>0?"Partly correct ("+Math.round(f*100)+"%). ":"Not quite. ")+msg)+'</div>';$("nx").textContent=i===N-1?"Finish":"Next";$("nx").className="b";strike()}
function unlockG(){const q=Q[i],dn=x=>x.classList.contains("ok")||x.classList.contains("no");q.groups.forEach((g,gi)=>{if(!g.gate)return;const ins=[...document.querySelectorAll('.tx[data-g="'+gi+'"]')];if(ins.some(x=>dn(x)||!x.disabled))return;if(g.gate.some(k=>[...document.querySelectorAll('.tx[data-g="'+k+'"]')].every(dn))){ins.forEach(x=>x.disabled=false);document.querySelector('[data-gl="'+gi+'"]').textContent=g.ln||g.l}})}
function grpNote(gi){const g=Q[i].groups[gi];if(g.rv)return;const ins=[...document.querySelectorAll('.tx[data-g="'+gi+'"]')],dn=x=>x.classList.contains("ok")||x.classList.contains("no");if(!ins.every(dn))return;const bad=ins.filter(x=>!x.classList.contains("ok")),last=ins[ins.length-1];if(!bad.length||last.dataset.nt)return;last.dataset.nt=1;let t;if(g.a){const got=new Set(ins.filter(x=>x.classList.contains("ok")).map(x=>+x.dataset.ix));t=g.a.filter((s,k)=>!got.has(k)).map(s=>s[0]).join(", ")}else t=g.show;last.insertAdjacentHTML("afterend",'<div class="rv n">Correct: '+t+'</div>')}
function notes(){Q[i].groups.forEach((g,gi)=>grpNote(gi))}
function evalTx(b){if(b.disabled||!b.value.trim())return;const q=Q[i],g=q.groups[+b.dataset.g],v=nm(b.value);let ok=false,ix=-1;
if(g.a){const used=[...document.querySelectorAll('.tx.ok[data-g="'+b.dataset.g+'"]')].map(x=>+x.dataset.ix),f=fn=>g.a.findIndex((s,k)=>!used.includes(k)&&s.some(t=>fn(v,nm(t))));ix=f((u,t)=>u===t);if(ix<0)ix=f((u,t)=>(" "+u+" ").includes(" "+t+" "));ok=ix>=0}
else ok=g.kw.some(k=>v.includes(nm(k)));
b.dataset.ix=ix;b.classList.add(ok?"ok":"no");b.disabled=true;if(!ok&&g.rv)b.insertAdjacentHTML("afterend",'<small class="rv"> Correct: '+g.a[0][0]+'</small>');unlockG();grpNote(+b.dataset.g);
const all=[...document.querySelectorAll(".tx")];if(all.every(x=>x.classList.contains("ok")||x.classList.contains("no"))){const tv=x=>+x.dataset.v,hit=all.filter(x=>x.classList.contains("ok")).reduce((s,x)=>s+tv(x),0),f=hit/all.reduce((s,x)=>s+tv(x),0);store[i]={vals:all.map(x=>x.value)};
notes();finish(f,"")}}
function check(){if(done)return;const q=Q[i];let f=0,msg="";
if(q.t==="let"){const bx=[...document.querySelectorAll(".bx")];if(bx.some(b=>!b.value))return;
let tot=0,hit=0;q.groups.forEach((g,gi)=>{const mine=bx.filter(b=>+b.dataset.g===gi),seen=new Set();mine.forEach(b=>{tot++;const ok=g.ans.includes(b.value)&&!seen.has(b.value);if(ok){hit++;seen.add(b.value)}b.classList.remove("ok","no");b.classList.add(ok?"ok":"no");b.disabled=true;if(!ok&&q.dg)b.insertAdjacentHTML("afterend",'<span class="cr" style="left:'+b.style.left+';top:'+b.style.top+'">'+g.ans[0]+'</span>')})});
f=hit/tot;store[i]={vals:bx.map(b=>b.value)};msg=(f===1||q.dg)?"":"Correct answers: "+q.groups.map(g=>(q.groups.length>1?g.l+" = ":"")+(g.nb&&g.nb<g.ans.length?"any "+g.nb+" of ":"")+g.ans.slice().sort().join(", ")).join(" | ")}
else{if(sel<0)return;
document.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;if(q.o[k]===q.a)b.classList.add("ok");else if(k===sel)b.classList.add("no")});
f=q.o[sel]===q.a?1:0;store[i]={sel};if(!f)msg="Correct answer: "+q.a}
finish(f,msg)}
let t0=Date.now(),tE=0;
const fmt=ms=>{const t=Math.max(0,Math.round(ms/1000)),m=Math.floor(t/60),s=t%60;return (m?m+" min ":"")+s+" sec"};
function cert(name,s,gr,c,tt){const W=1200,H=900,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d"),F='"Noto Sans Sinhala","Iskoola Pota",system-ui,-apple-system,"Segoe UI",sans-serif',G="#f2b705",GD="#9a7400",K="#222222";
x.fillStyle="#fff";x.fillRect(0,0,W,H);
x.strokeStyle=G;x.lineWidth=8;x.strokeRect(36,36,W-72,H-72);
x.strokeStyle=K;x.lineWidth=2;x.strokeRect(54,54,W-108,H-108);
x.textAlign="center";x.textBaseline="alphabetic";

x.strokeStyle=G;x.lineWidth=5;x.beginPath();x.moveTo(380,324);x.lineTo(820,324);x.stroke();
x.fillStyle=GD;x.font="bold 22px "+F;x.fillText("THIS IS TO CERTIFY THAT",W/2,380);
let fs=64;x.fillStyle=K;x.font="bold "+fs+"px "+F;while(x.measureText(name).width>860&&fs>24){fs-=2;x.font="bold "+fs+"px "+F}
x.fillText(name,W/2,455);
x.strokeStyle=G;x.lineWidth=3;x.beginPath();x.moveTo(250,478);x.lineTo(950,478);x.stroke();
x.fillStyle=K;x.font="bold 24px "+F;x.fillText("has successfully completed the quiz",W/2,526);
x.font="bold 28px "+F;x.fillText("Continuity of Life \u2013 Plant Sexual Reproduction & Flower Structure",W/2,572);
const pw=400,ph=52,px=(W-pw)/2,py=596,rr=26;x.beginPath();x.moveTo(px+rr,py);x.arcTo(px+pw,py,px+pw,py+ph,rr);x.arcTo(px+pw,py+ph,px,py+ph,rr);x.arcTo(px,py+ph,px,py,rr);x.arcTo(px,py,px+pw,py,rr);x.closePath();x.fillStyle=G;x.fill();
x.fillStyle=K;x.font="bold 30px "+F;x.fillText("LESSON 14 \u2013 QUIZ 2",W/2,633);
const cx=300,cy=762;x.beginPath();x.arc(cx,cy,56,0,7);x.lineWidth=9;x.strokeStyle=G;x.stroke();
x.fillStyle=GD;x.font="bold 14px "+F;x.fillText("SCORE",cx,cy-20);
x.fillStyle=K;x.font="bold 38px "+F;x.fillText(s+"%",cx,cy+22);
x.fillStyle=GD;x.font="bold 20px "+F;x.fillText("TIME TAKEN",W/2,740);x.fillText("DATE",900,740);
x.fillStyle=K;x.font="bold 30px "+F;x.fillText(tt,W/2,786);x.fillText(new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),900,786);
return cv.toDataURL("image/png")}
function end(){upd();$("pb").style.width="100%";document.querySelector(".bar").style.display="none";tE=Date.now();const s=Math.round(sc()),gr=s>=75?"A":s>=65?"B":s>=50?"C":s>=35?"S":"W",c=res.filter(r=>r===1).length,sk=res.filter(r=>r===null).length,tt=fmt(tE-t0);
$("main").innerHTML=`<div class="q" style="text-align:center">Your final score</div><div style="width:150px;height:150px;margin:14px auto 12px;border-radius:50%;border:10px solid var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:.8rem;font-weight:700;color:var(--mu)">SCORE</div><div style="font-size:2.4rem;font-weight:800;line-height:1.1;color:var(--ac)">${s}%</div></div><p style="text-align:center">Fully correct: ${c} of ${N}${sk?" &middot; Skipped: "+sk:""}<br>Time taken: <b>${tt}</b><br>Exam grade: ${gr}</p>
