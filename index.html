<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuity of Life - Quizzes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #1a252f;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #666666;
            margin-bottom: 30px;
        }

        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .quiz-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #27ae60;
            color: #ffffff;
            padding: 16px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .quiz-strip:hover {
            background-color: #219150;
            transform: translateY(-2px);
        }

        .quiz-strip:active {
            transform: translateY(0);
        }

        .arrow {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Continuity of Life</h1>
        <p class="subtitle">Select a Quiz to Start</p>

        <div class="quiz-list">
            <a href="Continuity of Life - Lesson 14 Quiz 01.html" class="quiz-strip">
                <span>Lesson 14 - Quiz 01</span>
                <span class="arrow">&rarr;</span>
            </a>

            <a href="Continuity of Life - Lesson 14 Quiz 02.html" class="quiz-strip">
                <span>Lesson 14 - Quiz 02</span>
                <span class="arrow">&rarr;</span>
            </a>

            <a href="Continuity of Life - Lesson 14 Quiz 03.html" class="quiz-strip">
                <span>Lesson 14 - Quiz 03</span>
                <span class="arrow">&rarr;</span>
            </a>
        </div>
    </div>

</body>
</html>
