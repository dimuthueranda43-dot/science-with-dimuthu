<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuity of Life - Quizzes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1c1e21;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            color: #1a252f;
            margin-bottom: 25px;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .quiz-card {
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 14px 15px;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .quiz-number {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a252f;
            margin-bottom: 4px;
        }

        .ready-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .btn-attend {
            display: inline-block;
            background-color: #27ae60;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-attend:hover {
            background-color: #219150;
            transform: translateY(-1px);
        }

        .btn-attend:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">Continuity of Life</h1>

        <div class="quiz-container">
            <!-- Quiz 1 -->
            <div class="quiz-card">
                <div class="quiz-number">Quiz 1</div>
                <div class="ready-text">Ready to start?</div>
                <a href="Continuity of Life - Lesson 14 Quiz 01.html" class="btn-attend">Attend the quiz</a>
            </div>

            <!-- Quiz 2 -->
            <div class="quiz-card">
                <div class="quiz-number">Quiz 2</div>
                <div class="ready-text">Ready to start?</div>
                <a href="Continuity of Life - Lesson 14 Quiz 02.html" class="btn-attend">Attend the quiz</a>
            </div>

            <!-- Quiz 3 -->
            <div class="quiz-card">
                <div class="quiz-number">Quiz 3</div>
                <div class="ready-text">Ready to start?</div>
                <a href="Continuity of Life - Lesson 14 Quiz 03.html" class="btn-attend">Attend the quiz</a>
            </div>
        </div>
    </div>

</body>
</html>
